version: '3.8'

services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python ml_model/seed_db.py &&
             gunicorn bankpredict.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-docker-key-bankpredict-2026
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DB_ENGINE=mysql
      - DB_NAME=bankpredict_db
      - DB_USER=bankuser
      - DB_PASSWORD=bankpassword
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: bankpredict_mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_DATABASE: bankpredict_db
      MYSQL_USER: bankuser
      MYSQL_PASSWORD: bankpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
