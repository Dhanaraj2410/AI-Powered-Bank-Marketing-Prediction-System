{% extends 'base.html' %}

{% block title %}Contact - BankPredict AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card-custom p-4 p-md-5">
        <h2 class="fw-bold text-center mb-3"><i class="fas fa-envelope text-info me-2"></i>Contact Us</h2>
        <p class="text-muted text-center mb-4">Have questions about BankPredict AI or enterprise integration? Send us a message.</p>

        <form method="POST" action="{% url 'contact' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label text-muted">Full Name</label>
            <input type="text" name="name" class="form-control form-control-custom" placeholder="e.g. Sarah Jenkins" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted">Email Address</label>
            <input type="email" name="email" class="form-control form-control-custom" placeholder="e.g. sarah@bankdomain.com" required>
          </div>
          <div class="mb-4">
            <label class="form-label text-muted">Message</label>
            <textarea name="message" class="form-control form-control-custom" rows="4" placeholder="How can we help your team?" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-bold">
            <i class="fas fa-paper-plane me-2"></i> Send Message
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
