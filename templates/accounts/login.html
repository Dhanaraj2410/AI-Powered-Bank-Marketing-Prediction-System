{% extends 'base.html' %}

{% block title %}Login - BankPredict AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card-custom p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="fas fa-lock text-info fs-1 mb-2"></i>
          <h2 class="fw-bold">Sign In</h2>
          <p class="text-muted">Access your BankPredict AI workspace</p>
        </div>

        <form method="POST" action="{% url 'login' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label text-muted">Username</label>
            <input type="text" name="username" class="form-control form-control-custom" placeholder="Enter username" required>
          </div>
          <div class="mb-4">
            <label class="form-label text-muted">Password</label>
            <input type="password" name="password" class="form-control form-control-custom" placeholder="Enter password" required>
          </div>
          <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-bold mb-3">
            <i class="fas fa-sign-in-alt me-2"></i> Login
          </button>
        </form>

        <div class="text-center text-muted">
          Don't have an account? <a href="{% url 'register' %}" class="text-info text-decoration-none">Register here</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
